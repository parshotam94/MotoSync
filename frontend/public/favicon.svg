<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#000000"/>
  <!-- Outer aqua ring -->
  <circle cx="32" cy="32" r="30" stroke="#00e5ff" stroke-width="2.5" fill="none" opacity="0.7"/>
  <!-- Motorcycle silhouette body -->
  <ellipse cx="32" cy="36" rx="14" ry="6" fill="#00e5ff" opacity="0.15"/>
  <!-- Rear wheel -->
  <circle cx="20" cy="38" r="8" stroke="#00e5ff" stroke-width="2.5" fill="none"/>
  <circle cx="20" cy="38" r="2.5" fill="#00e5ff"/>
  <!-- Front wheel -->
  <circle cx="44" cy="38" r="8" stroke="#00e5ff" stroke-width="2.5" fill="none"/>
  <circle cx="44" cy="38" r="2.5" fill="#00e5ff"/>
  <!-- Frame / body -->
  <path d="M20 38 L28 24 L38 24 L44 38" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Seat -->
  <path d="M28 24 L38 24 L36 20 L30 20 Z" fill="#00e5ff" opacity="0.8"/>
  <!-- Handlebars -->
  <path d="M38 24 L46 20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- GPS pulse dot -->
  <circle cx="32" cy="14" r="3" fill="#00e5ff"/>
  <circle cx="32" cy="14" r="6" stroke="#00e5ff" stroke-width="1" fill="none" opacity="0.5"/>
</svg>
